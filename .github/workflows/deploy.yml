# .github/workflows/deploy.yml
name: CI/CD Deploy Chatbot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            set -e
            cd /var/www/chatbot

            OLD=$(git rev-parse HEAD)
            git pull origin main
            NEW=$(git rev-parse HEAD)
            MARK=/var/www/chatbot/.deployed-sha

            # Base de comparacion: el ultimo SHA aplicado en este servidor.
            # Si no hay marcador (primer deploy con este sistema) o el commit ya no
            # existe, se aplica todo: es la unica forma de no dejar cambios sin desplegar
            # cuando un push trae varios commits.
            if [ -f "$MARK" ] && git cat-file -e "$(cat "$MARK")^{commit}" 2>/dev/null; then
              BASE=$(cat "$MARK")
              CHANGED=$(git diff --name-only "$BASE" "$NEW")
            else
              BASE=""
              CHANGED="TODO"
            fi

            echo "commit desplegado: $OLD -> $NEW (base de comparacion: ${BASE:-ninguna, se aplica todo})"
            echo "--- cambios ---"
            echo "$CHANGED"

            if [ "$CHANGED" = "TODO" ] || echo "$CHANGED" | grep -qE '^backend/chatbot\.service$'; then
              echo "-> unit de systemd"
              install -m 644 backend/chatbot.service /etc/systemd/system/chatbot.service
              systemctl daemon-reload
              systemctl enable chatbot.service
            fi

            if [ "$CHANGED" = "TODO" ] || echo "$CHANGED" | grep -qE '^backend/(pyproject\.toml|uv\.lock)$'; then
              echo "-> deps de python"
              cd /var/www/chatbot/backend
              uv sync --frozen
              cd /var/www/chatbot
            fi

            if [ "$CHANGED" = "TODO" ] || echo "$CHANGED" | grep -q '^frontend/'; then
              echo "-> build del frontend"
              cd /var/www/chatbot/frontend
              npm ci
              npm run build
              cd /var/www/chatbot
            fi

            # El servicio va antes que nginx: la unit crea RuntimeDirectory y el socket
            # nuevo, y solo despues nginx puede apuntar a esa ruta sin dar 502.
            if [ "$CHANGED" = "TODO" ] || echo "$CHANGED" | grep -qE '^backend/.*\.py$|^backend/chatbot\.service$|^backend/(pyproject\.toml|uv\.lock)$'; then
              echo "-> restart de chatbot.service"
              systemctl restart chatbot.service
              sleep 3
              echo "-> health check"
              curl -fsS --unix-socket /run/chatbot/chatbot.sock http://localhost/health
              echo
              # socket de la version anterior (fuera de RuntimeDirectory)
              rm -f /run/chatbot.sock
            fi

            if [ "$CHANGED" = "TODO" ] || echo "$CHANGED" | grep -q '^nginx/'; then
              echo "-> nginx"
              bash nginx/apply.sh
            fi

            echo "$NEW" > "$MARK"
            echo "deploy OK: $NEW"
