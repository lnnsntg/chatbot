# .github/workflows/deploy.yml
name: CI/CD Deploy Chatbot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # necesario para comparar HEAD~1 vs HEAD

      - name: Detectar cambios
        id: changes
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "deps=$(echo "$changed" | grep -qE '^backend/(pyproject\.toml|uv\.lock)$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "backend=$(echo "$changed" | grep -qE '^backend/.*\.py$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "unit=$(echo "$changed" | grep -qE '^backend/chatbot\.(service|socket)$' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "frontend=$(echo "$changed" | grep -q '^frontend/' && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Pull en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            cd /var/www/chatbot
            git pull origin main

      - name: Instalar unit de systemd (si cambió la unit)
        if: steps.changes.outputs.unit == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            install -m 644 /var/www/chatbot/backend/chatbot.service /etc/systemd/system/chatbot.service
            install -m 644 /var/www/chatbot/backend/chatbot.socket /etc/systemd/system/chatbot.socket
            systemctl daemon-reload
            systemctl enable chatbot.socket chatbot.service

      - name: Sync Python deps (si cambió backend)
        if: steps.changes.outputs.deps == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            cd /var/www/chatbot/backend
            uv sync --frozen

      - name: Build frontend (si cambió frontend)
        if: steps.changes.outputs.frontend == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            cd /var/www/chatbot/frontend
            npm ci
            npm run build

      - name: Restart service (si cambió backend, deps o unit)
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.deps == 'true' || steps.changes.outputs.unit == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            systemctl restart chatbot.socket
            systemctl restart chatbot.service

      - name: Health check (si se reinició)
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.deps == 'true' || steps.changes.outputs.unit == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            sleep 3
            curl -fsS --unix-socket /run/chatbot.sock http://localhost/health
